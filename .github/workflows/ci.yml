name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & Test (Ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    defaults:
      run:
        working-directory: ./ManagerShop

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v4
        with:
          build-root-directory: ./ManagerShop
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Run Unit Tests (Shared Module)
        run: ./gradlew :shared:testDebugUnitTest :shared:jvmTest

      - name: Compile Desktop App (Bytecode Check)
        run: ./gradlew :desktopApp:compileKotlin

      - name: Build Android Debug APK
        run: ./gradlew :androidApp:assembleDebug

      - name: Upload Test Reports (if failed or passed)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            ManagerShop/shared/build/reports/tests/
          retention-days: 7

      - name: Upload Android Debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: manager-shop-debug-apk
          path: ManagerShop/androidApp/build/outputs/apk/debug/*.apk
          retention-days: 7
